    <title>Gemini 3D Camera Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              casc: {
                black: '#000000',     // Primary Headings
                text: '#1F2937',      // Body text
                gray: '#F5F5F7',      // Light gray backgrounds
                blue: '#2563EB',      // Electric Blue accent
                blue_light: '#EBF2FF', // Light blue bg
                border: '#E5E7EB',
              },
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 20px -5px rgba(37, 99, 235, 0.4)', // Blue glow
            }
          },
        },
      }
    </script>
    <style>
      body {
        background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
        color: #1F2937;
      }
      /* Clean scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF; 
      }
    </style>
